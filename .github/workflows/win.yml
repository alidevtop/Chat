name: Windows

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    # Public GitHub-hosted runner. windows-11-arm is self-hosted only.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt: ""
            generator: ""
          - arch: x64
            qt: qt6
            generator: ""
          - arch: x64
            qt: ""
            generator: "Ninja Multi-Config"

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      MSYS2_ARG_CONV_EXCL: "*"
      # Disable ccache globally — this is the direct cause of the
      # "Could not determine vs dep dependency prefix string" Meson error.
      CCACHE_DISABLE: "1"
      CC: "cl"
      CXX: "cl"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries 2>nul
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild 2>nul
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      # Set up MSVC BEFORE any other step so PATH/INCLUDE/LIB are consistent.
      - name: Native Tools Command Prompt.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # Put Strawberry Perl's ccache.exe behind real MSVC tools and
      # reassert CC/CXX so Meson's cl probe doesn't get wrapped output.
      - name: Neutralize ccache / pin MSVC.
        shell: bash
        run: |
          {
            echo "CCACHE_DISABLE=1"
            echo "CC=cl"
            echo "CXX=cl"
            echo "CMAKE_C_COMPILER=cl"
            echo "CMAKE_CXX_COMPILER=cl"
          } >> $GITHUB_ENV

          # Remove Strawberry Perl from PATH for all subsequent steps.
          if [ -n "$GITHUB_PATH" ]; then :; fi
          echo "C:\\Strawberry\\c\\bin" >> /dev/null || true

      - name: Strip Strawberry Perl from PATH (cmd).
        shell: cmd
        run: |
          set "NEWPATH="
          for %%P in ("%PATH:;=" "%") do (
            echo %%P | findstr /I /C:"Strawberry" >nul || (
              if defined NEWPATH (set "NEWPATH=%NEWPATH%;%%~P") else (set "NEWPATH=%%~P")
            )
          )
          echo PATH=%NEWPATH%>>%GITHUB_ENV%

      - name: First set up.
        shell: bash
        run: |
          set -e
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win.md"
          if [ -f "$DOCPATH" ]; then
            SDK="$(grep "SDK version" "$DOCPATH" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/' || true)"
          else
            SDK=""
          fi
          echo "SDK=$SDK" >> $GITHUB_ENV

          # Remove /Zi from Debug init flags to save CI disk. Ignore if not found.
          for f in "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake; do
            [ -f "$f" ] && sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$f" || true
          done

          CACHE_KEY_FILE="$TBUILD/CACHE_KEY.txt"
          : > "$CACHE_KEY_FILE"
          if [ -f "$TBUILD/$REPO_NAME/$PREPARE_PATH" ]; then
            sha256sum "$TBUILD/$REPO_NAME/$PREPARE_PATH" | awk '{ print $1 }' >> "$CACHE_KEY_FILE"
          fi
          echo "$SDK" >> "$CACHE_KEY_FILE"
          echo "CACHE_KEY=$(sha256sum "$CACHE_KEY_FILE" | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Sample"
          git config --global advice.detachedHead false
          git config --global core.autocrlf false

      - name: NuGet sources.
        shell: cmd
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages" || exit /b 0
          nuget sources Add -Source https://api.nuget.org/v3/index.json || exit /b 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-

      - name: Libraries.
        env:
          GYP_MSVS_VERSION: 2022
        run: |
          set "PATH=%PATH:C:\Strawberry\c\bin;=%"
          set "CCACHE_DISABLE=1"
          set "CC=cl"
          set "CXX=cl"
          call %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent ${{ matrix.qt }}
          if errorlevel 1 exit /b %errorlevel%

      - name: Read configuration matrix.
        shell: bash
        run: |
          set -e
          ARTIFACT_NAME="Telegram"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              x64_arm64) ARCH="arm64";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.generator }}"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          if [ -n "$GENERATOR" ]; then ARCH=""; fi
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.defines }}"
          fi
          echo "TDESKTOP_BUILD_DEFINE=$DEFINE" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          API="-D TDESKTOP_API_TEST=ON"
          if [ "$GITHUB_REF" == 'refs/heads/nightly' ]; then
            API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        shell: bash
        run: |
          find "$LibrariesPath" \( -name '*.o' -o -name '*.a.o' -o -name '*_automoc.cpp' -o -name 'moc_*.cpp' \) -delete 2>/dev/null || true

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        shell: cmd
        env:
          CL: "-D_USE_STD_VECTOR_ALGORITHMS=0"
        run: |
          set "PATH=%PATH:C:\Strawberry\c\bin;=%"
          cd /d %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
            %TDESKTOP_BUILD_GENERATOR% ^
            %TDESKTOP_BUILD_ARCH% ^
            ${{ matrix.qt }} ^
            %TDESKTOP_BUILD_API% ^
            -D CMAKE_CONFIGURATION_TYPES=Debug ^
            -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT="" ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
            %TDESKTOP_BUILD_DEFINE%
          if errorlevel 1 exit /b %errorlevel%

          cmake --build ..\out --config Debug --parallel
          if errorlevel 1 exit /b %errorlevel%

      - name: Move artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        shell: cmd
        run: |
          set "OUT=%TBUILD%\%REPO_NAME%\out\Debug"
          mkdir artifact 2>nul
          if exist "%OUT%\Telegram.exe" move "%OUT%\Telegram.exe" artifact\
          if exist "%OUT%\Updater.exe"  move "%OUT%\Updater.exe"  artifact\

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
          if-no-files-found: warn
